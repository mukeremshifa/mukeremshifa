<svg xmlns="http://www.w3.org/2000/svg" width="880" height="366" viewBox="0 0 880 366" font-family="ui-monospace,'SF Mono','Cascadia Mono','DejaVu Sans Mono','Segoe UI Mono',Menlo,Consolas,monospace" role="img"><rect width="880" height="366" rx="10" fill="#191714"/><rect x=".5" y=".5" width="879" height="365" rx="9.5" fill="none" stroke="#302B24"/><rect x="70" y="20" width="1" height="326" fill="#302B24"/><text x="96" y="36" font-size="10" fill="#8B7128" letter-spacing=".18em" font-weight="400">ABOUT</text><text x="54" y="62" font-size="11" fill="#302B24" text-anchor="end">01</text><text x="96" y="62" font-size="13.5" fill="#6B6558">// about.md</text><text x="54" y="83.5" font-size="11" fill="#302B24" text-anchor="end">02</text><text x="54" y="94.5" font-size="11" fill="#302B24" text-anchor="end">03</text><text x="96" y="94.5" font-size="13.5" fill="#F4F1E8">I like the problems that hide behind the demo.</text><text x="54" y="116.0" font-size="11" fill="#302B24" text-anchor="end">04</text><text x="54" y="127.0" font-size="11" fill="#302B24" text-anchor="end">05</text><text x="96" y="127.0" font-size="13.5" fill="#F4F1E8">Anyone can call an LLM API. The work is everything</text><text x="54" y="148.5" font-size="11" fill="#302B24" text-anchor="end">06</text><text x="96" y="148.5" font-size="13.5" fill="#F4F1E8">around it: deciding which passage is worth retrieving,</text><text x="54" y="170.0" font-size="11" fill="#302B24" text-anchor="end">07</text><text x="96" y="170.0" font-size="13.5" fill="#F4F1E8">keeping one client's documents out of another client's</text><text x="54" y="191.5" font-size="11" fill="#302B24" text-anchor="end">08</text><text x="96" y="191.5" font-size="13.5" fill="#F4F1E8">answers, and holding a conversation together when the</text><text x="54" y="213.0" font-size="11" fill="#302B24" text-anchor="end">09</text><text x="96" y="213.0" font-size="13.5" fill="#F4F1E8">stream drops halfway through a sentence.</text><text x="54" y="234.5" font-size="11" fill="#302B24" text-anchor="end">10</text><text x="54" y="245.5" font-size="11" fill="#302B24" text-anchor="end">11</text><text x="96" y="245.5" font-size="13.5" fill="#F4F1E8">I am early in my career and I learn by shipping whole</text><text x="54" y="267.0" font-size="11" fill="#302B24" text-anchor="end">12</text><text x="96" y="267.0" font-size="13.5" fill="#F4F1E8">systems rather than tutorials. The four projects below</text><text x="54" y="288.5" font-size="11" fill="#302B24" text-anchor="end">13</text><text x="96" y="288.5" font-size="13.5" fill="#EEBA2B">are deployed, tested and documented.</text><text x="54" y="310.0" font-size="11" fill="#302B24" text-anchor="end">14</text><text x="54" y="321.0" font-size="11" fill="#302B24" text-anchor="end">15</text><text x="96" y="321.0" font-size="13.5" fill="#6B6558">// open to junior and entry-level roles</text></svg>