<svg xmlns="http://www.w3.org/2000/svg" width="880" height="133" viewBox="0 0 880 133" font-family="ui-monospace,'SF Mono','Cascadia Mono','DejaVu Sans Mono','Segoe UI Mono',Menlo,Consolas,monospace" role="img"><rect width="880" height="133" rx="10" fill="#191714"/><rect x=".5" y=".5" width="879" height="132" rx="9.5" fill="none" stroke="#302B24"/><rect width="6" height="133" fill="#C8F14D"/><rect x="6" width="2" height="133" fill="#C8F14D" opacity=".25"/><text x="34" y="38" font-size="17" font-weight="600" fill="#F4F1E8" letter-spacing=".01em">SynapseDeck</text><text x="846" y="38" font-size="10" fill="#C8F14D" letter-spacing=".14em" text-anchor="end">LIVE</text><text x="34" y="60" font-size="12" fill="#9C9483">Notes in, flashcards out, reviewed on a real FSRS scheduler. Cards stream</text><text x="34" y="77" font-size="12" fill="#9C9483">in as the model writes them and pass a review gate before entering a deck.</text><text x="34" y="94" font-size="12" fill="#9C9483">Every figure on the progress page is counted from an append-only log.</text><rect x="34" y="103" width="69" height="20" rx="3" fill="#221F1B" stroke="#302B24"/><text x="69" y="117" font-size="10.5" fill="#9C9483" text-anchor="middle">React 19</text><rect x="110.2" y="103" width="82" height="20" rx="3" fill="#221F1B" stroke="#302B24"/><text x="151" y="117" font-size="10.5" fill="#9C9483" text-anchor="middle">TypeScript</text><rect x="199.2" y="103" width="69" height="20" rx="3" fill="#221F1B" stroke="#302B24"/><text x="234" y="117" font-size="10.5" fill="#9C9483" text-anchor="middle">Supabase</text><rect x="275.4" y="103" width="108" height="20" rx="3" fill="#221F1B" stroke="#302B24"/><text x="329" y="117" font-size="10.5" fill="#9C9483" text-anchor="middle">Edge Functions</text><rect x="390.0" y="103" width="63" height="20" rx="3" fill="#221F1B" stroke="#302B24"/><text x="421" y="117" font-size="10.5" fill="#9C9483" text-anchor="middle">ts-fsrs</text></svg>