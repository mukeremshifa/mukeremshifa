<svg xmlns="http://www.w3.org/2000/svg" width="880" height="133" viewBox="0 0 880 133" font-family="ui-monospace,'SF Mono','Cascadia Mono','DejaVu Sans Mono','Segoe UI Mono',Menlo,Consolas,monospace" role="img"><rect width="880" height="133" rx="10" fill="#1b1813"/><rect x=".5" y=".5" width="879" height="132" rx="9.5" fill="none" stroke="#34312c"/><rect width="6" height="133" fill="#52b788"/><rect x="6" width="2" height="133" fill="#52b788" opacity=".25"/><text x="34" y="38" font-size="17" font-weight="600" fill="#f3ece2" letter-spacing=".01em">Survey Quest</text><text x="846" y="38" font-size="10" fill="#52b788" letter-spacing=".14em" text-anchor="end">PROTOTYPE</text><text x="34" y="60" font-size="12" fill="#a3988c">A React prototype that turns a questionnaire into a light game loop:</text><text x="34" y="77" font-size="12" fill="#a3988c">XP, levels, badges and a confetti finish. Progress is awarded for</text><text x="34" y="94" font-size="12" fill="#a3988c">participation only, so the survey data stays honest.</text><rect x="34" y="103" width="50" height="20" rx="3" fill="#2a2722" stroke="#34312c"/><text x="59" y="117" font-size="10.5" fill="#a3988c" text-anchor="middle">React</text><rect x="91.0" y="103" width="82" height="20" rx="3" fill="#2a2722" stroke="#34312c"/><text x="132" y="117" font-size="10.5" fill="#a3988c" text-anchor="middle">TypeScript</text><rect x="180.0" y="103" width="44" height="20" rx="3" fill="#2a2722" stroke="#34312c"/><text x="202" y="117" font-size="10.5" fill="#a3988c" text-anchor="middle">Vite</text></svg>